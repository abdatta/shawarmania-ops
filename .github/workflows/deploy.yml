# Kept short on purpose. GitHub prefixes every check on a commit with the
# workflow name, so this word is repeated five times in the commit's check
# list. "Deploy to GitHub Pages" made each line unreadable before it reached
# the part that says what actually ran.
name: Deploy

# A push to `main` publishes — once the whole suite says the commit is good.
#
# This workflow and `ci.yml` used to be independent workflows on the same push
# trigger, with nothing between them. The deploy one only compiled the bundle,
# so a push published to the counters as soon as the code *compiled*, while
# the tests ran beside it or had already gone red. Attendance is in real use
# on staff phones, so that was live exposure rather than a theoretical one.
#
# The trigger is unchanged. What changed is that the publish now runs the
# whole verification suite first, from the same file `ci.yml` uses, applies
# forward production migrations, and only then publishes the static bundle.
# A red verification or migration stops before Pages, leaving the current
# deployment live.
#
# The wait is the cost, and it is the point: a push to `main` reaches the
# counters some minutes later rather than immediately, and only if the suite
# agrees.
#
# Rollback is unchanged: Actions → Deploy → Run workflow,
# choosing an earlier commit. It re-verifies that commit on the way through.
# Accepted deliberately — the commit being rolled back to passed the same
# suite when it landed, so the re-run is expected green, and a rollback only
# reaches a counter tablet on its next launch anyway (see the service-worker
# section of docs/OPERATIONS.md). CI minutes are not the slow part.
#
# The trigger skips a commit that cannot change what is built, served or
# migrated, because a publish for such a commit has nothing to publish. The list
# is the complement of `docs.yml`'s and matches `ci.yml`'s exactly; see the
# reasoning in `ci.yml` for why it is a denylist and why `openspec/tools/**` is
# not in it.
#
# One consequence, deliberate: the bundle stamps its own commit into the shell,
# so after a prose-only push `Build <sha>` names the last commit that changed the
# app rather than the tip of `main`. That is the more truthful number — it names
# the code that is running — and `docs/OPERATIONS.md` says so. `workflow_dispatch`
# is never path-filtered, so deliberate republication is unaffected.
on:
  push:
    branches: [main]
    paths-ignore:
      - 'docs/**'
      - 'openspec/changes/**'
      - 'openspec/specs/**'
      - 'openspec/todos/**'
      - '.claude/**'
      - '*.md'
  # Lets a known-good commit be re-published without an empty commit.
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One publish at a time. `cancel-in-progress: false` because cancelling a
# half-finished publish is how you end up serving a partial build.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  # The same suite `ci.yml` runs on a pull request, from the same file. A
  # publish cannot be gated on a weaker check set than a pull request,
  # because there is only one check set.
  #
  # This is also why `ci.yml` no longer triggers on a push to `main`: this job
  # is that run. One suite per commit, and it is the one holding the gate.
  #
  # It includes the Docker-backed database job, deliberately. Most of that job
  # tests the tenancy boundary, which a static bundle cannot change — but it
  # also holds `test:e2e:auth`, the only suite that drives four real roles
  # signing in against a real backend. A bundle that breaks sign-in is the
  # worst thing this workflow could hand to somebody standing at a counter,
  # and it is invisible to every other job. Waiting for Docker is the price of
  # not publishing that.
  # Named `gate` rather than `verify` because GitHub puts this job's name in
  # the middle of every check it produces — `Deploy / gate / browser tests`.
  # "gate" says what this stage is doing in a deploy workflow; "verify" would
  # just repeat the file it calls.
  gate:
    uses: ./.github/workflows/verify.yml
    permissions:
      contents: read

  # Deliberately NOT behind `needs: gate`. Nothing the suite produces feeds
  # this build, so waiting for it only delays the answer. Two things follow:
  #
  #   - a green push publishes ~35s sooner, since this 32s job overlaps the
  #     4m gate instead of queuing behind it;
  #   - `auth:readiness` is the only check that probes the live identity
  #     backend, and it now reports at ~40s instead of ~4m50s.
  #
  # Running on a commit that later fails the gate costs ~40s of runner time
  # and one read-only readiness probe. The artifact it uploads is inert:
  # `deploy` needs both jobs, so nothing can publish it.
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # The build stamps the short commit SHA into the UI.
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Require production auth readiness
        env:
          VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ vars.VITE_SUPABASE_ANON_KEY }}
        run: npm run auth:readiness

      - name: Build
        # Project sites serve from /<repo>/. On a custom domain this becomes
        # BASE_PATH: / and nothing else changes.
        #
        # The Supabase pair is the PUBLIC pair, and it is baked into the
        # JavaScript bundle — that is the design, not a leak: the anon key is
        # meant to be public and Row-Level Security is what protects the data
        # (docs/SECURITY_AND_PRIVACY.md). They live in repository variables
        # rather than secrets for exactly that reason; a value published in
        # every bundle is not a secret, and pretending otherwise makes the
        # real secret — the service-role key — look equally routine.
        #
        # The readiness step above fails closed when either value is absent or
        # the #24 backend/data rollout is incomplete. A permanent username UI
        # must never publish ahead of the identity state it requires.
        env:
          BASE_PATH: /
          VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ vars.VITE_SUPABASE_ANON_KEY }}
        run: npm run build

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  # Schema and frontend are one release. The verified migration runs before
  # Pages can publish, so a bundle cannot reach staff phones while production
  # is still missing a function, table or column it calls.
  #
  # The environment secret is a project-scoped Postgres pooler URL. This job
  # receives neither the browser's public anon key nor a service-role key, and
  # it deliberately runs only `db push`: never reset, seed or config push.
  # Manual workflow dispatch is a frontend rollback/republication, so it keeps
  # the forward-only production schema where it is instead of trying to make
  # an older commit reverse migration history.
  migrate:
    needs: gate
    runs-on: ubuntu-latest
    environment:
      name: production-database
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Require production database credential
        if: github.event_name == 'push'
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: test -n "$SUPABASE_DB_URL"

      - name: Apply forward production migrations
        if: github.event_name == 'push'
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: npx supabase db push --db-url "$SUPABASE_DB_URL" --yes

      - name: Keep the forward schema during a manual frontend rollback
        if: github.event_name == 'workflow_dispatch'
        run: echo "Manual republication does not reverse production migrations."

  # The single publication gate. Verification, the production migration and
  # the build must all pass. Any red dependency leaves the current Pages
  # deployment live.
  deploy:
    needs: [gate, build, migrate]
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
