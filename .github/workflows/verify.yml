name: Verify

# The single definition of "this commit is good". Nothing triggers it
# directly. Three callers use it, and that is the point: `ci.yml` runs it on
# every pull request, `staging.yml` before staging moves, and `deploy.yml`
# before it is allowed to publish anything a Staging run did not verify. One
# definition means a publish cannot be gated on a weaker suite than a pull
# request is.
#
# Every suite runs on every code change; the split is only for speed. A push
# waits for the slowest job, so each slow suite is spread across runners
# (`--shard` for the demo browser suite and the unit tests, `e2e-auth/shards.ts`
# for the auth suite), and each job starts its slow setup side by side. Every
# runner holds at most one browser suite on one fresh stack, as before.
# Eighteen jobs: GitHub runs twenty at once on a free account, and a caller adds
# its own. `scripts/check-verify.test.mjs` holds every gate to this file.
on:
  workflow_call:

jobs:
  verify:
    # Each job is named for the thing only it can catch, because that is the
    # question you have when you see it red. They split on what they need:
    # this one needs nothing but the repo, the unit tests a few runners, the
    # browser suites a browser, and the last three a database.
    name: lint, types, build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # The build stamps the short commit SHA into the UI.
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - run: npm ci

      - name: Lint
        run: npm run lint

      - name: Format check
        run: npm run format:check

      - name: Typecheck
        run: npm run typecheck

      - name: Edge Function mapping contract typecheck
        run: npm run functions:typecheck

      # Both themes. A token that passes in light and fails in dark is a
      # failure, not a compromise.
      - name: Contrast validator
        run: npm run contrast

      - name: Build
        run: npm run build

  # About four minutes of component tests on one runner, so two runners take
  # half each. Vitest splits by file.
  unit:
    name: unit tests (${{ matrix.shard }}/2)
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Unit and component tests
        run: npm test -- --shard=${{ matrix.shard }}/${{ strategy.job-total }}

  # Each runner takes a third of the tests, one worker each, as one runner did
  # before: serial in CI, because the offline specs share a service worker
  # registration.
  e2e:
    name: e2e browser tests (${{ matrix.shard }}/3)
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Which Playwright
        id: playwright
        run: echo "version=$(node -p "require('@playwright/test/package.json').version")" >> "$GITHUB_OUTPUT"

      # Chromium is half a minute to download and the same bytes every time.
      - uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright.outputs.version }}

      - name: Install Chromium while the app builds for the suite
        run: |
          npx playwright install --with-deps chromium > playwright-install.log 2>&1 &
          browsers=$!
          node scripts/build-for-e2e.mjs demo
          status=0; wait "$browsers" || status=$?
          cat playwright-install.log
          exit "$status"

      - name: Run Playwright
        env:
          E2E_PREBUILT: 1
        run: npm run test:e2e -- --shard=${{ matrix.shard }}/${{ strategy.job-total }}

      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: playwright-report-${{ matrix.shard }}
          path: playwright-report/
          retention-days: 7

  # The same suite with every change gate on: the state a release creates. The
  # job above is the gates-off run, production's default and the way back. The
  # two run in parallel so a push waits no longer, and this one stops in
  # seconds when no gate is declared, because then the two runs are the same
  # (a-release-can-be-switched-off, D10).
  e2e-gates-on:
    name: e2e browser tests (gates on, ${{ matrix.shard }}/3)
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Is any change gate declared?
        id: gates
        run: |
          count=$(node scripts/check-change-gates.mjs --count)
          echo "count=$count" >> "$GITHUB_OUTPUT"
          if [ "$count" = "0" ]; then
            echo "No change gate is declared, so gates on is gates off: nothing more to run."
          fi

      - name: Which Playwright
        if: steps.gates.outputs.count != '0'
        id: playwright
        run: echo "version=$(node -p "require('@playwright/test/package.json').version")" >> "$GITHUB_OUTPUT"

      - uses: actions/cache@v4
        if: steps.gates.outputs.count != '0'
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright.outputs.version }}

      - name: Install Chromium while the app builds for the suite
        if: steps.gates.outputs.count != '0'
        run: |
          npx playwright install --with-deps chromium > playwright-install.log 2>&1 &
          browsers=$!
          node scripts/build-for-e2e.mjs demo
          status=0; wait "$browsers" || status=$?
          cat playwright-install.log
          exit "$status"

      - name: Run Playwright with every gate on
        if: steps.gates.outputs.count != '0'
        env:
          E2E_PREBUILT: 1
        run: npm run test:e2e:on -- --shard=${{ matrix.shard }}/${{ strategy.job-total }}

      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() && steps.gates.outputs.count != '0' }}
        with:
          name: playwright-report-gates-on-${{ matrix.shard }}
          path: playwright-report/
          retention-days: 7

  # The tenancy boundary is enforced in the database, so the database is what
  # gets tested: every migration applied to a fresh stack, the pgTAP isolation
  # and write-contract suites, real-session REST probes, and a check that the
  # committed TypeScript types match what the schema actually generates.
  # The Supabase CLI version comes from package.json (devDependency), so local
  # and CI always run the same one. Studio is the one container no test uses,
  # and the largest image to pull.
  db:
    name: database tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Start the local stack (applies migrations and seed)
        run: npx supabase start -x studio

      - name: Database policy suite (pgTAP)
        run: npm run test:db

      - name: REST-level isolation probes and account flows
        run: npm run test:rls

      - name: Generated types are current
        run: |
          npm run db:types
          git diff --exit-code src/data-access/database.types.ts

  # The one browser suite that needs a real backend: four roles signing in, an
  # account provisioned end to end with a one-time code, a deactivation ending
  # an open session, the tills, the kitchen and the request budget. Split by
  # file across four runners, each on its own fresh stack (e2e-auth/shards.ts);
  # the stack starts while Chromium installs and the app builds beside it.
  auth:
    name: auth browser tests (${{ matrix.shard }}/4)
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Which Playwright
        id: playwright
        run: echo "version=$(node -p "require('@playwright/test/package.json').version")" >> "$GITHUB_OUTPUT"

      - uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright.outputs.version }}

      - name: Start the local stack while Chromium installs and the app builds
        run: |
          npx supabase start -x studio > supabase-start.log 2>&1 &
          stack=$!
          npx playwright install --with-deps chromium
          node scripts/build-for-e2e.mjs auth
          status=0; wait "$stack" || status=$?
          cat supabase-start.log
          exit "$status"

      - name: Auth end-to-end (against the local stack)
        env:
          E2E_PREBUILT: 1
          E2E_AUTH_SHARD: ${{ matrix.shard }}/${{ strategy.job-total }}
        run: npm run test:e2e:auth

      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: playwright-report-auth-${{ matrix.shard }}
          path: playwright-report/
          retention-days: 7

  # The auth suite with every change gate on, on fresh stacks of its own: its
  # global setup turns every declared gate on through the service role before
  # the run (D10). Parallel with the job above, split the same way, and skipped
  # when no gate is declared.
  auth-gates-on:
    name: auth browser tests (gates on, ${{ matrix.shard }}/4)
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Is any change gate declared?
        id: gates
        run: |
          count=$(node scripts/check-change-gates.mjs --count)
          echo "count=$count" >> "$GITHUB_OUTPUT"
          if [ "$count" = "0" ]; then
            echo "No change gate is declared, so gates on is gates off: nothing more to run."
          fi

      - name: Which Playwright
        if: steps.gates.outputs.count != '0'
        id: playwright
        run: echo "version=$(node -p "require('@playwright/test/package.json').version")" >> "$GITHUB_OUTPUT"

      - uses: actions/cache@v4
        if: steps.gates.outputs.count != '0'
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright.outputs.version }}

      - name: Start the local stack while Chromium installs and the app builds
        if: steps.gates.outputs.count != '0'
        run: |
          npx supabase start -x studio > supabase-start.log 2>&1 &
          stack=$!
          npx playwright install --with-deps chromium
          node scripts/build-for-e2e.mjs auth
          status=0; wait "$stack" || status=$?
          cat supabase-start.log
          exit "$status"

      - name: Auth end-to-end with every gate on
        if: steps.gates.outputs.count != '0'
        env:
          E2E_PREBUILT: 1
          E2E_AUTH_SHARD: ${{ matrix.shard }}/${{ strategy.job-total }}
        run: npm run test:e2e:auth:on

      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() && steps.gates.outputs.count != '0' }}
        with:
          name: playwright-report-auth-gates-on-${{ matrix.shard }}
          path: playwright-report/
          retention-days: 7
