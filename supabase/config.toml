# Supabase local development configuration.
#
# Run `supabase start` to bring the local stack up. It prints the anon key —
# copy it into .env (see .env.example). The service-role key it also prints
# never goes into client configuration.
#
# No schema or migrations yet: those land with data-model-and-tenancy (#2),
# which also brings the RLS policies and the isolation test suite.

project_id = "shawarmania-ops"

[api]
enabled = true
port = 54321
schemas = ["public", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
shadow_port = 54320
major_version = 17

[db.pooler]
enabled = false

[studio]
enabled = true
port = 54323

# Local email testing. Nothing is ever sent to a real address from local.
# (Named [inbucket] before CLI 2.x.)
[local_smtp]
enabled = true
port = 54324

[storage]
enabled = true
file_size_limit = "50MiB"

[auth]
enabled = true
site_url = "http://127.0.0.1:7412"
additional_redirect_urls = [
  "http://127.0.0.1:7412",
]
# Short-lived access tokens are what make the claim model safe: app_role and
# app_outlet_id are baked in at issue, so an hour bounds how stale a claim can
# get. Deactivation does NOT rely on this — policies check status per request.
jwt_expiry = 3600
enable_refresh_token_rotation = true
# Tolerates the double-refresh a flaky counter connection produces.
refresh_token_reuse_interval = 10
# Staff accounts are admin-provisioned; there is no self-service signup.
enable_signup = false

# DELIBERATELY ABSENT: no refresh-token inactivity timeout. A delivery employee
# who opens the app fortnightly must not be re-authenticating each time, and
# there is no self-service password reset to rescue them if they are. Ending a
# session early is an administrative act (deactivate the account), which bites
# immediately through the policies — not a timer. Do not "tighten" this without
# reading docs/ROLES_AND_PERMISSIONS.md first.

# Staff sign in with username + password. Supabase Auth stores each username as
# a reserved internal email alias, pre-confirmed by the provisioning function;
# no confirmation mail is sent.
#
# enable_signup here maps to GoTrue's "external email enabled", which gates
# email SIGN-IN as well as signup — it must stay true or admin-provisioned
# users cannot log in at all. Self-service registration is blocked globally
# by [auth] enable_signup = false above.
[auth.email]
enable_signup = true
enable_confirmations = true
double_confirm_changes = true

# Phone auth is not used at all.
[auth.sms]
enable_signup = false
enable_confirmations = false

# No access-token hook, deliberately (multi-outlet-people, owner 2026-07-29).
# The function is gone too, as of 2026-07-30 — retired in two steps because a
# deployed project registers its hook in its own auth settings rather than
# here, so dropping it while that registration stood would have failed every
# token issue and locked everybody out, including whoever would go and turn it
# off. #22 emptied it, the registration came off in the dashboard, then a
# one-line migration dropped it.
# Nothing about what a person may do is carried in their token: policies read
# `public.assignments` through stable security-definer helpers, so granting or
# ending an assignment bites at the next request with nothing to reissue. The
# helpers are set-returning, so a policy still makes one lookup per query
# rather than the per-row profile sub-query the old claims existed to avoid.

[analytics]
enabled = false

[edge_runtime]
enabled = true

# Account provisioning. The gateway check only proves the caller holds *a*
# valid token — the anon key is one — so the function re-derives the caller's
# role and outlet from their own session before doing anything.
[functions.admin-accounts]
# The function performs the authoritative Auth verification itself so it can
# distinguish a rejected human credential from a received backend failure and
# return the canonical session_invalid response.
verify_jwt = false

# Redeeming a one-time code. Deliberately open: someone who has never set a
# password has no token to present. Its protection is the code itself (50 bits,
# hashed at rest, single use, five attempts, seven days) and a response that
# looks the same however it fails.
[functions.redeem-invite]
verify_jwt = false

# Associated-email sign-in is public by definition. It resolves the private
# email-to-alias mapping server-side, rate-limits hashed attempt keys, and asks
# Supabase Auth to verify the password with the public anon credential.
[functions.email-sign-in]
verify_jwt = false

# The counter handshake, and tablet administration. Every action re-derives its
# own caller — an admin, an operator, or a tablet — because the gateway check
# only proves somebody holds a token, and a tablet holds one too.
[functions.counter-devices]
verify_jwt = true

# Setting a tablet up. Open for the same reason redeeming an invite is: a tablet
# that has never been set up has no token to present. Its protection is the setup
# code (50 bits, hashed at rest, single use, five attempts, fifteen minutes), the
# one-active-tablet-per-outlet invariant in Postgres, and a response that looks
# the same however the code fails.
[functions.counter-setup]
verify_jwt = false

# Settlement read from Zomato. Open at the gateway because the caller is a
# scheduled job, not a person: it holds AGGREGATOR_SYNC_SECRET rather than a
# Supabase session, and a token-free caller would be refused before the function
# ever ran. Its protection is that secret, compared in constant time, plus the
# outlet allow-list in AGGREGATOR_SYNC_OUTLETS, which is what stops a leaked
# credential writing anywhere but the two outlets it was issued for.
[functions.ingest-aggregator-cycle]
verify_jwt = false

# Starting a run, and starting a login, from the owner's phone. Verified at the
# gateway because the caller IS a person holding a session, and an anonymous
# request should be refused before it reaches code that holds a GitHub token
# capable of dispatching workflows in a private repository. The function then
# re-derives the owner role from the caller's own token, because being an Edge
# Function is not authorisation.
[functions.request-aggregator-sync]
verify_jwt = true

# The one-time password, on its way from the owner's phone to a browser in a
# datacentre. Verified at the gateway for the same reason, and the shortest
# function in this repo on purpose: it does not log the code, echo it, or say
# which of the four ways a request could be unanswerable applied.
[functions.answer-aggregator-otp]
verify_jwt = true

# The reader's own door: load and save its session, collect the code it is
# waiting for. Open at the gateway because the caller is the same scheduled job
# that posts settlement, holding the same secret rather than a session.
#
# This exists so the reader never holds the service-role key. That key opens
# staff records, attendance, billing and every customer; scoped to this endpoint,
# a leaked GitHub secret buys the Zomato session alone, which one owner tap
# revokes.
[functions.aggregator-reader]
verify_jwt = false

# The one door a statement comes through, from either caller: the reader posting
# the bytes it downloaded, or a person uploading the file they saved. Open at the
# gateway because it answers two kinds of caller and the gateway can verify only
# one — it checks them itself, the reader's shared secret or a person's session
# token whose outlet authority is re-derived inside. The parser it shares with the
# reader is what makes the disaster-recovery upload exercised on every run.
[functions.parse-operator-statement]
verify_jwt = false
