# Supabase local development configuration.
#
# Run `supabase start` to bring the local stack up. It prints the anon key —
# copy it into .env (see .env.example). The service-role key it also prints
# never goes into client configuration.
#
# No schema or migrations yet: those land with data-model-and-tenancy (#2),
# which also brings the RLS policies and the isolation test suite.

project_id = "shawarmania-ops"

[api]
enabled = true
port = 54321
schemas = ["public", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
shadow_port = 54320
major_version = 17

[db.pooler]
enabled = false

[studio]
enabled = true
port = 54323

# Local email testing. Nothing is ever sent to a real address from local.
# (Named [inbucket] before CLI 2.x.)
[local_smtp]
enabled = true
port = 54324

[storage]
enabled = true
file_size_limit = "50MiB"

[auth]
enabled = true
site_url = "http://127.0.0.1:5173"
additional_redirect_urls = ["http://127.0.0.1:5173"]
jwt_expiry = 3600
enable_refresh_token_rotation = true
refresh_token_reuse_interval = 10
# Staff accounts are admin-provisioned; there is no self-service signup.
enable_signup = false

# Staff sign in with email + password, admin-provisioned with the address
# pre-confirmed — no confirmation mail is ever sent (owner-confirmed
# 2026-07-26, replacing the earlier phone+password model).
#
# enable_signup here maps to GoTrue's "external email enabled", which gates
# email SIGN-IN as well as signup — it must stay true or admin-provisioned
# users cannot log in at all. Self-service registration is blocked globally
# by [auth] enable_signup = false above.
[auth.email]
enable_signup = true
enable_confirmations = false

# Phone auth is not used at all.
[auth.sms]
enable_signup = false
enable_confirmations = false

# Injects app_role and app_outlet_id into every access token so RLS policies
# read claims instead of sub-querying profiles (the recursion trap in
# docs/ARCHITECTURE.md). The function ships in the migration set.
[auth.hook.custom_access_token]
enabled = true
uri = "pg-functions://postgres/public/custom_access_token_hook"

[analytics]
enabled = false

[edge_runtime]
enabled = true
