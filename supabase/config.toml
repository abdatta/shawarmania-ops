# Supabase local development configuration.
#
# Run `supabase start` to bring the local stack up. It prints the anon key —
# copy it into .env (see .env.example). The service-role key it also prints
# never goes into client configuration.
#
# No schema or migrations yet: those land with data-model-and-tenancy (#2),
# which also brings the RLS policies and the isolation test suite.

project_id = "shawarmania-ops"

[api]
enabled = true
port = 54321
schemas = ["public", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
shadow_port = 54320
major_version = 17

[db.pooler]
enabled = false

[studio]
enabled = true
port = 54323

# Local email testing. Nothing is ever sent to a real address from local.
# (Named [inbucket] before CLI 2.x.)
[local_smtp]
enabled = true
port = 54324

[storage]
enabled = true
file_size_limit = "50MiB"

[auth]
enabled = true
site_url = "http://127.0.0.1:5173"
additional_redirect_urls = ["http://127.0.0.1:5173"]
jwt_expiry = 3600
enable_refresh_token_rotation = true
refresh_token_reuse_interval = 10
# Staff accounts are admin-provisioned; there is no self-service signup.
enable_signup = false

[auth.email]
enable_signup = false
enable_confirmations = false

# Personal smartphones sign in with phone number + password. No SMS provider
# and no TRAI/DLT registration is required, because no OTP is ever sent.
[auth.sms]
enable_signup = false
enable_confirmations = false

[analytics]
enabled = false

[edge_runtime]
enabled = true
